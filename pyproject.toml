[project]
name = "shelflife"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "cryptography>=41",
    "django>=5.2,<6",
    "djangorestframework>=3.15",
    "celery>=5.4",
    "redis>=5",
    "psycopg[binary]>=3.2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-django>=4", "factory_boy>=3.3", "responses>=0.25"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
DJANGO_SETTINGS_MODULE = "src.config.settings_test"
